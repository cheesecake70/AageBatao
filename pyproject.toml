[project]
name = "aage-batao"
version = "0.1.0"
description = "Next-word autocomplete for Roman-script Hinglish, and a study of synthetic augmentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasketch>=2.0.0",
    "fastapi>=0.162.0",
    "gdown>=6.5.1",
    "kenlm>=0.3.0",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "black",
    "mypy",
    "matplotlib>=3.11.2",
    "httpx>=0.28.1",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aagebatao"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
